name: Documentation problem
description: Report incorrect, missing, or unclear guidance.
title: "[Docs]: "
body:
  - type: input
    id: page
    attributes:
      label: Page or section
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction and supporting app version
