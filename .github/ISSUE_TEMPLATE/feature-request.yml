name: Feature request
description: Explain a workflow PL Sweep could improve.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What task or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
